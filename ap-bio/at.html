<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Antigen Composer – v8 (angle-quantize)</title>
  <style>
    html,body{margin:0;height:100%;display:flex;justify-content:center;align-items:center;background:#fffdf6;}
    svg{background:#ffffff;border:1px solid #c9e4f7;}
  </style>
</head>
<body>

<svg id="antigenCanvas" width="640" height="420" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <!-- ========== 片段定义 =========-->
  <defs>
    <!-- 示意 H / L；如有 H3…L10 依样扩展 -->
    <symbol id="H1" viewBox="0 0 100 100">
      <polyline points="10,50 50,10 90,50" stroke="#0079c9" stroke-width="3" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="H2" viewBox="0 0 100 100">
      <polyline points="10,15 50,85 90,15" stroke="#0079c9" stroke-width="3" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="L1" viewBox="0 0 100 100">
      <path d="M10 50 Q50 10 90 50" stroke="#0079c9" stroke-width="3" stroke-linecap="round" fill="none"/>
    </symbol>
  </defs>

  <!-- 顶部矩形 -->
  <rect id="topRect" x="0" y="10" width="100" height="40" fill="none" stroke="#222" stroke-width="2"/>

  <!-- 左右链骨架路径 -->
  <g id="antigenLeft">
    <path id="axisLeft" d="M60 50 Q40 130 60 210" fill="none" stroke="none"/>
  </g>
  <g id="antigenRight" transform="translate(400 0) scale(-1 1)">
    <path id="axisRight" d="M60 50 Q40 130 60 210" fill="none" stroke="none"/>
  </g>

  <!-- 底部横线 / 竖线 -->
  <line id="bottomLine" x1="0" y1="210" x2="100" y2="210" stroke="#222" stroke-width="2"/>
  <line id="vertLine" x1="0" y1="0" x2="0" y2="40" stroke="#0079c9" stroke-width="2"/>
</svg>

<script>
/**************** 调试常量 ****************/
const HEAVY = {
  SCALE:   0.12,
  GAP:     35,
  SHIFT_X: -5,
  SHIFT_Y: -28,
  IDS:     ['H2','H1','H2']   // 顺序可自由调整/扩展
};

const LIGHT = {
  SCALE:   0.5,
  GAP:     0,
  SHIFT_X: 120,
  SHIFT_Y: -77,
  IDS:     ['L1']
};

const TOP_RECT_WIDTH  = 100;
const BOTTOM_LINE_LEN = 100;

const VERT_LINE_LEN   = 50;
const VERT_SHIFT_X    = -15;
const VERT_SHIFT_Y    = -VERT_LINE_LEN/2;
/*****************************************/

// ----- 工具函数 -----
const cfgFor = id => id.startsWith('H') ? HEAVY : LIGHT;
const quantize = (deg, step=90) => Math.round(deg/step)*step;  // 量化角度到 0/90/180/270°

function placePieces(pathEl, groupEl, ids, quantizeHeavy=true){
  const NS = 'http://www.w3.org/2000/svg';
  const len= pathEl.getTotalLength();
  const baseOffset = (len - cfgFor(ids[0]).GAP * (ids.length-1)) / 2;

  groupEl.querySelectorAll('use.piece').forEach(n=>n.remove());

  ids.forEach((id,i)=>{
    const cfg = cfgFor(id);
    const d   = baseOffset + i * cfg.GAP;
    const p1  = pathEl.getPointAtLength(d);
    const p2  = pathEl.getPointAtLength(Math.min(d+0.01,len));
    let ang   = Math.atan2(p2.y-p1.y, p2.x-p1.x)*180/Math.PI;
    if(quantizeHeavy && id.startsWith('H')) ang = quantize(ang,90);  // 保证 H 片端角度稳定

    const u = document.createElementNS(NS,'use');
    u.classList.add('piece');
    u.setAttribute('href','#'+id);
    u.setAttribute('vector-effect','non-scaling-stroke');
    u.setAttribute('transform',
      `translate(${p1.x + cfg.SHIFT_X} ${p1.y + cfg.SHIFT_Y}) rotate(${ang}) translate(-50 -50) scale(${cfg.SCALE})`);
    groupEl.appendChild(u);

    // 竖线跟随首个 L
    if(groupEl.id==='antigenLeft' && id.startsWith('L') && i===0){
      positionVertLine(p1,ang);
    }
  });
}

function positionVertLine(center,angleDeg){
  const rad=angleDeg*Math.PI/180;
  const dx = VERT_SHIFT_X*Math.cos(rad)-VERT_SHIFT_Y*Math.sin(rad);
  const dy = VERT_SHIFT_X*Math.sin(rad)+VERT_SHIFT_Y*Math.cos(rad);
  const x=center.x+dx, y=center.y+dy;
  document.getElementById('vertLine')
    .setAttribute('x1',x);
  document.getElementById('vertLine')
    .setAttribute('y1',y-VERT_LINE_LEN/2);
  document.getElementById('vertLine')
    .setAttribute('x2',x);
  document.getElementById('vertLine')
    .setAttribute('y2',y+VERT_LINE_LEN/2);
}

window.addEventListener('DOMContentLoaded',()=>{
  // 顶/底横线长度居中
  document.getElementById('topRect').setAttribute('width',TOP_RECT_WIDTH);
  document.getElementById('topRect').setAttribute('x',(400-TOP_RECT_WIDTH)/2);
  document.getElementById('bottomLine').setAttribute('x1',(400-BOTTOM_LINE_LEN)/2);
  document.getElementById('bottomLine').setAttribute('x2',(400+BOTTOM_LINE_LEN)/2);

  // 布局 Left (Light) & Right (Heavy)
  placePieces(document.getElementById('axisLeft'),  document.getElementById('antigenLeft'),  LIGHT.IDS, false);
  placePieces(document.getElementById('axisRight'), document.getElementById('antigenRight'), HEAVY.IDS, true);
});
</script>
</body>
</html>
