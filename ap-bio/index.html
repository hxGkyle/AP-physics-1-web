<style>
  /* ===== Reset ===== */
  *,*:before,*:after{box-sizing:border-box;margin:0;padding:0;}
  html, body { height: 100%; }

  /* ===== Background & Typography ===== */
  body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:radial-gradient(circle at center,#e9f5ff 0%,#c9e4f7 45%,#b0d8f1 100%);
    color:#073b4c;
  }

#randomize-antigen:hover { background:#0e799c; }

  /* ===== Header ===== */
  header{text-align:center;padding:1rem 2rem;background:#118ab2;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14);}  
  header h1{font-size:1.9rem;margin-bottom:.3rem;}
  header p{font-size:1rem;opacity:.85;}

  /* ===== Main Grid ===== */
  .main{flex:1;min-height:0;padding:1rem 2rem;display:grid;gap:1rem;grid-template-columns:150px 150px 1fr 320px;}
  .panel{background:rgba(255,255,255,.85);border-radius:14px;padding:1rem;display:flex;flex-direction:column;min-height:0;overflow:hidden;backdrop-filter:blur(3px);box-shadow:0 2px 6px rgba(0,0,0,.08);}  
  .panel h2{font-size:1.1rem;margin-bottom:.6rem;color:#118ab2;}
  .vlist{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding-right:.3rem;scrollbar-width:auto; max-height: 100%;}
  .vlist::-webkit-scrollbar{width:6px;} .vlist::-webkit-scrollbar-thumb{background:#8ecae6;border-radius:3px;}

  /* ===== Chain Thumbnails ===== */
  .chain-img{
    position:relative;width:100%;height:100px;min-height:100px;max-height:100px;border:2px solid transparent;border-radius:8px;background:#fff;cursor:pointer;transition:border .2s;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden;
  }
  .chain-img:hover{border-color:#118ab2;}  
  .chain-img.selected{border-color:#118ab2;background:#e6f4ff;box-shadow:0 0 0 3px rgba(17,138,178,.3);}  
  .chain-name{position:absolute;bottom:4px;left:0;right:0;font-size:.8rem;font-weight:bold;text-align:center;pointer-events:none;}

  /* ===== Center Panel ===== */
  #center-panel{position:relative;align-items:center;justify-content:center;gap:1rem;}
  #floating-area{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
  .slot{width:200px;height:200px;border:2px dashed #bfd7ea;border-radius:12px;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;z-index:2;}
  #antigen-slot{
  width:300px;          /* 1.5 × 200 */
  height:300px;
}
  .slot img{position:absolute;width:90%;height:auto;object-fit:contain;}
  .chain-slot-container{display:flex;gap:1.5rem;}
  .chain-slot-container .slot{width:160px;height:160px;}
  #release-btn{margin-top:1rem;align-self:center;padding:.6rem 1.6rem;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;background:#ffb703;color:#7a5200;transition:background .2s;z-index:2;}
  #release-btn:hover:not(:disabled){background:#fca311;}
  #release-btn:disabled{background:#ccc;color:#666;cursor:not-allowed;}

  /* ===== Result Panel / Bottom Bar ===== */
  #result-display{flex:1;display:flex;align-items:center;justify-content:center;font-size:.9rem;text-align:center;border:2px dashed #8ecae6;border-radius:10px;background:rgba(255,255,255,.45);padding:.5rem;}
  .bottom-bar{padding:.8rem 2rem;background:#d3eafd;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 6px rgba(0,0,0,.05);}  
  .bottom-bar button{padding:.5rem 1.3rem;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;background:#118ab2;color:#fff;transition:background .2s;}  
  .bottom-bar button:hover{background:#0e799c;}

  /* ===== Floating Antibodies ===== */
  .floating-antibody{position:absolute;width:120px;height:120px;pointer-events:none;transition:transform .5s ease-out;}

  /* ===== Flash Effect ===== */
  @keyframes flash{0%{opacity:0;}50%{opacity:.9;}100%{opacity:0;}}
  .flash-effect{position:absolute;inset:0;background:rgba(255,215,0,.45);pointer-events:none;border-radius:inherit;animation:flash .8s ease-out forwards;}
</style>

<script>

  function placePieces({path, group, ids, gap, scale, shiftX=0, shiftY=0, rotOffset=0}) {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (typeof path === 'string') ? document.getElementById(path) : path;
  if (!el || typeof el.getTotalLength !== 'function') return;
  const len = el.getTotalLength();
  const start = (len - gap * (ids.length - 1)) / 2;
  // 先删掉已有的
  group.querySelectorAll('use.piece').forEach(n => n.remove());
  ids.forEach((id, i) => {
    const d = start + i * gap;
    const p1 = el.getPointAtLength(d);
    const p2 = el.getPointAtLength(Math.min(d + 0.01, len));
    const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180/Math.PI + rotOffset;
    const u = document.createElementNS(NS, 'use');
    u.classList.add('piece');
    u.setAttribute('href', `#${id}`);
    u.setAttribute('vector-effect','non-scaling-stroke');
    u.setAttribute('transform',
      `translate(${p1.x + shiftX} ${p1.y + shiftY}) ` +
      `rotate(${ang}) translate(-50 -50) scale(${scale})`);
    group.appendChild(u);
  });
}
function placePiecesAg(opts){
  const {
    path, group, ids, gap, scale,
    shiftX=0, shiftY=0, rotOffset=0,
    quantizeHeavy=true, mirrorAngle=false
  } = opts;

  const el = (typeof path==='string')
               ? group.querySelector(path)
               : path;
  if(!el || typeof el.getTotalLength!=='function') return;

  const NS   = 'http://www.w3.org/2000/svg';
  const len  = el.getTotalLength();
  const base = (len - gap * (ids.length-1)) / 2;

  group.querySelectorAll('use.piece').forEach(n=>n.remove());

  ids.forEach((id,i)=>{
    const d  = base + i*gap;
    const p1 = el.getPointAtLength(d);
    const p2 = el.getPointAtLength(Math.min(d+0.01,len));
    let ang  = Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI + rotOffset;
    if(quantizeHeavy && id.startsWith('H')) ang = Math.round(ang/90)*90;
    if(mirrorAngle) ang = ang;   // 保持镜像

    const u = document.createElementNS(NS,'use');
    u.classList.add('piece');
    u.setAttribute('href',`#${id}`);
    u.setAttribute('transform',
      `translate(${p1.x+shiftX} ${p1.y+shiftY}) rotate(${ang}) `+
      `translate(-50 -50) scale(${scale})`);
    group.appendChild(u);

    /* —— 定位竖线（仅左 L 第 1 片） —— */
    if(group.id==='agLeft' && id.startsWith('L') && i===0){
      const VLEN=55, VX=130, VY=16, rad=ang*Math.PI/180;
      const x=p1.x+shiftX + VX*Math.cos(rad)-VY*Math.sin(rad);
      const y=p1.y+shiftY + VX*Math.sin(rad)+VY*Math.cos(rad);
      const svgRoot = group.ownerSVGElement;          // 当前 use 所在的 <svg>
      const line    = svgRoot.getElementById('agVertLine');
      line.setAttribute('x1',x); line.setAttribute('x2',x);
      line.setAttribute('y1',y-VLEN/2); line.setAttribute('y2',y+VLEN/2);
    }
  });
}

/*************************************************
 *  State                                        *
 *************************************************/
let selectedHeavy = { V:null, D:null, J:null };
let selectedLight = null;
let heavyIndex = 0;               // 0→V, 1→D, 2→J
let currentAg = '1';
let floatingAntibodies = [];
let animationStarted = false;
let antigenLightId  = '';      // 当前抗原的 L 片段 id
let antigenHeavyIds = [];      // 当前抗原的 3 条 H 片段 id（数组）

/*************************************************
 *  DOM convenience                              *
 *************************************************/
const heavyList        = document.getElementById('heavy-list');
const lightList        = document.getElementById('light-list');
const resultDisp       = document.getElementById('result-display');
const heavySlotsEls    = { V:document.getElementById('slot-heavy-v'), D:document.getElementById('slot-heavy-d'), J:document.getElementById('slot-heavy-j') };
const lightSlotEl      = document.getElementById('light-slot');
const antigenSlot      = document.getElementById('antigen-slot');
const releaseBtn       = document.getElementById('release-btn');
const floatingArea     = document.getElementById('floating-area');

/*************************************************
 *  Build chain lists                            *
 *************************************************/
function buildChainLists(){
  function makeThumb(chain, color){
    const div=document.createElement('div');
    div.className='chain-img';
    div.dataset.chainId=chain.id;
    div.dataset.type=color;

    // chain.svg is raw string; wrap in container so we can style
    const holder=document.createElement('div');
    holder.innerHTML=chain.svg;
    holder.style.width='100%';
    holder.style.height='100%';
    holder.style.objectFit='contain';
    div.appendChild(holder);

    const label=document.createElement('div');
    label.className='chain-name';
    label.textContent=chain.id;
    label.style.color=color==='heavy'? '#0079c9':'#ef476f';
    div.appendChild(label);

    return div;
  }

  chains.heavy.forEach(ch=>heavyList.appendChild(makeThumb(ch,'heavy')));
  chains.light.forEach(ch=>lightList.appendChild(makeThumb(ch,'light')));
}

/*************************************************
 *  Selection logic                              *
 *************************************************/
function selectChain(el){
  const type = el.dataset.type;
  const chainId = el.dataset.chainId;

  document.querySelectorAll('.chain-img').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');

  if(type==='heavy'){
    const parts=['V','D','J'];
    const part=parts[heavyIndex];
    const chainObj = chains.heavy.find(c=>c.id===chainId);
    selectedHeavy[part]={...chainObj};

    // render into slot rotated -90deg
    renderIntoSlot(heavySlotsEls[part], chainObj.svg, -90);

    heavyIndex=(heavyIndex+1)%3;
  } else {
    const chainObj = chains.light.find(c=>c.id===chainId);
    selectedLight={...chainObj};
    renderIntoSlot(lightSlotEl, chainObj.svg, 90);
  }

  // reset binding message and enable release if complete
  resultDisp.textContent='Awaiting assembly…';
  releaseBtn.disabled=!isAntibodyComplete();
}

function renderIntoSlot(slot, svgString, rotationDeg){
  slot.innerHTML='';
  const wrapper=document.createElement('div');
  wrapper.innerHTML=svgString;
  wrapper.style.transform=`rotate(${rotationDeg}deg)`;
  wrapper.style.width='90%';
  wrapper.style.height='auto';
  wrapper.style.objectFit='contain';
  slot.appendChild(wrapper);
}

function isAntibodyComplete(){
  return selectedHeavy.V && selectedHeavy.D && selectedHeavy.J && selectedLight;
}

/*************************************************
 *  Binding check logic (same as first version)  *
 *************************************************/
function isMatch () {
  if (!(selectedHeavy.V && selectedHeavy.D && selectedHeavy.J && selectedLight)) {
    return false;                 // 片段没选全
  }

  // 1) 轻链必须完全一致
  if (selectedLight.id !== antigenLightId) return false;

  // 2) 三条重链（V/D/J）与抗原的 H 片段比：只要“集合相同”即可
  const you   = [selectedHeavy.V.id, selectedHeavy.D.id, selectedHeavy.J.id].sort().join('');
  const agSet = [...antigenHeavyIds].sort().join('');
  return you === agSet;
}
function flash(el){
  const f=document.createElement('div');
  f.className='flash-effect';
  el.appendChild(f);
  setTimeout(()=>f.remove(),800);
}

/*************************************************
 *  Antibody SVG builder (from last snippet)     *
 *************************************************/
const ANTIBODY_CONFIG = {
  baseSize: 360,
  chainPositions: {
    light  : { x:110,y:110,scale:0.3,rotation:118 },
    heavyV : { x:250,y:110,scale:0.3,rotation:118 },
    heavyD : { x:210,y:220,scale:0.3,rotation:118 },
    heavyJ : { x:250,y:220,scale:0.3,rotation:118 }
  },
  floatingSpeed : 0.4,
  rotationSpeed : 0.1
};

function createAntibodySvg() {
  return `
<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Heavy left branch -->
  <g id="heavyLeftGroup">
    <polyline points="170,330 170,220 110,110 95,118 150,220"
              fill="none" stroke="#0093ff" stroke-width="3" stroke-linecap="square"/>
    <path id="axisHeavyLeft"
          d="M170 330 L170 220 L110 110 L95 118 L150 220"
          fill="none"/>
  </g>

  <!-- Heavy right branch (mirror) -->
  <g id="heavyRightGroup" transform="translate(360 0) scale(-1 1)">
    <polyline points="170,330 170,220 110,110 95,118 150,220"
              fill="none" stroke="#0093ff" stroke-width="3" stroke-linecap="square"/>
    <path id="axisHeavyRight"
          d="M170 330 L170 220 L110 110 L95 118 L150 220"
          fill="none"/>
  </g>

  <!-- Light left branch -->
  <g id="lightLeftGroup" transform="translate(-20 15)">
    <polyline points="125.35,211.49 79.17,126.83 63.75,135.21 110,220"
              fill="none" stroke="#0093ff" stroke-width="3" stroke-linecap="square"/>
    <path id="axisLightLeft"
          d="M125.35 211.49 L79.17 126.83 L63.75 135.21 L110 220"
          fill="none"/>
  </g>

  <!-- Light right branch (mirror) -->
  <g id="lightRightGroup" transform="translate(360 0) scale(-1 1) translate(-20 15)">
    <polyline points="125.35,211.49 79.17,126.83 63.75,135.21 110,220"
              fill="none" stroke="#0093ff" stroke-width="3" stroke-linecap="square"/>
    <path id="axisLightRight"
          d="M125.35 211.49 L79.17 126.83 L63.75 135.21 L110 220"
          fill="none"/>
  </g>
</svg>`;
}

function decorateAntibodySvg(svgEl, heavyChain, lightChain) {
  // heavy left
  placePieces({
    path   : svgEl.getElementById('axisHeavyLeft'),
    group  : svgEl.getElementById('heavyLeftGroup'),
    ids    : [heavyChain.J.id, heavyChain.D.id, heavyChain.V.id],  // D-V-J order
    gap    : 35,
    scale  : 0.12,
    shiftX : -5,
    shiftY : -28
  });

  // heavy right
  placePieces({
    path   : svgEl.getElementById('axisHeavyRight'),
    group  : svgEl.getElementById('heavyRightGroup'),
    ids    : [heavyChain.J.id, heavyChain.D.id, heavyChain.V.id],
    gap    : 35,
    scale  : 0.12,
    shiftX : -5,
    shiftY : -28
  });

  // light left
  placePieces({
    path     : svgEl.getElementById('axisLightLeft'),
    group    : svgEl.getElementById('lightLeftGroup'),
    ids      : [lightChain.id],
    gap      : 0,
    scale    : 0.28,
    shiftX   : 30,
    shiftY   : 30,
    rotOffset: 270
  });

  // light right
  placePieces({
    path     : svgEl.getElementById('axisLightRight'),
    group    : svgEl.getElementById('lightRightGroup'),
    ids      : [lightChain.id],
    gap      : 0,
    scale    : 0.28,
    shiftX   : 30,
    shiftY   : 30,
    rotOffset: 270
  });
}

/* ========= Antigen 生成模块 ========= */
function createAntigenSvg () {
  return `
<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <!-- 顶部固定矩形 -->
  <rect x="150" y="10" width="100" height="40"
        fill="none" stroke="#222" stroke-width="2"/>
  <!-- 左 L 路径 -->
  <g id="agLeft">
    <path id="axisAgL" d="M60 50 Q40 130 60 210" fill="none"></path>
  </g>
  <!-- 右 H 路径（镜像） -->
  <g id="agRight" transform="translate(400 0) scale(-1 -1)">
    <path id="axisAgH" d="M60 50 L60 210" fill="none"></path>
  </g>
  <!-- 底部横线 -->
  <line x1="154" y1="210" x2="246" y2="210"
        stroke="#222" stroke-width="2"/>
  <!-- 动态竖线 -->
  <line id="agVertLine" stroke="#0079c9" stroke-width="2"/>
</svg>`;
}

function decorateAntigenSvg (svgEl, lightId /* 如 "L3" */) {
  // 参数配置与独立 demo 一致
  //const cfgL = { scale:0.5, gap:0,  shiftX:120, shiftY:-77, rotOffset:270 };
const cfgL = {      // 轻链 (左)
  scale: 0.5,
  gap:   0,
  shiftX: 120,
  shiftY: -75,   // 原来 -77, 抬高一点
  rotOffset: 0   // ← 由 270 改 0，让 L 竖起来
};
const cfgH = { scale: 0.25, gap:52, shiftX: 75, shiftY:  -260, rotOffset:  0 };

  // 左 L
 placePiecesAg({
  path : svgEl.getElementById('axisAgL'),
  group: svgEl.getElementById('agLeft'),
  ids  : [lightId],
  ...cfgL,  quantizeHeavy:false, mirrorAngle:false
  });

  // 右 H
  placePiecesAg({
  path : svgEl.getElementById('axisAgH'),
  group: svgEl.getElementById('agRight'),
  ids  : antigenHeavyIds,
  ...cfgH, quantizeHeavy:true,  mirrorAngle:false
  });

}

/*************************************************
 *  Floating antibody helpers (from middle)      *
 *************************************************/
function generateFloatingAntibodies(heavyChain, lightChain, count, container, scale = 1) {
  const arr  = [];
  const rect = container.getBoundingClientRect();

  for (let i = 0; i < count; i++) {
    const div = document.createElement('div');
    div.className = 'floating-antibody';
    // 把骨架 SVG 放进来：
    div.innerHTML = createAntibodySvg();

    // 拿到刚插入的 <svg> 元素：
    const svgEl = div.querySelector('svg');
    // 先统一缩放：
    svgEl.setAttribute('width', 360 * scale);
    svgEl.setAttribute('height', 360 * scale);

    // 再动态贴重轻链片段：
    decorateAntibodySvg(svgEl, heavyChain, lightChain);

    // 随机定位
    const x = 10 + Math.random() * (rect.width  - 140);
    const y = 10 + Math.random() * (rect.height - 140);
    div.style.left = `${x}px`;
    div.style.top  = `${y}px`;

    container.appendChild(div);
    arr.push({
      element      : div,
      x, y,
      dx           : (Math.random() - 0.5) * ANTIBODY_CONFIG.floatingSpeed,
      dy           : (Math.random() - 0.5) * ANTIBODY_CONFIG.floatingSpeed,
      rotation     : Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * ANTIBODY_CONFIG.rotationSpeed
    });
  }
  return arr;
}

function animate(){
  const rect=floatingArea.getBoundingClientRect();
  floatingAntibodies.forEach(ab=>{
    ab.x+=ab.dx;
    ab.y+=ab.dy;
    ab.rotation+=ab.rotationSpeed;

    if(ab.x<10){ab.x=10;ab.dx=Math.abs(ab.dx);} 
    if(ab.y<10){ab.y=10;ab.dy=Math.abs(ab.dy);} 
    if(ab.x>rect.width-130){ab.x=rect.width-130;ab.dx=-Math.abs(ab.dx);} 
    if(ab.y>rect.height-130){ab.y=rect.height-130;ab.dy=-Math.abs(ab.dy);} 

    ab.element.style.left=`${ab.x}px`;
    ab.element.style.top =`${ab.y}px`;
    ab.element.style.transform=`rotate(${ab.rotation}deg)`;
  });
  requestAnimationFrame(animate);
}

// Delegated click for selection
heavyList.addEventListener('click',e=>{
  const img=e.target.closest('.chain-img');
  if(img) selectChain(img);
});
lightList.addEventListener('click',e=>{
  const img=e.target.closest('.chain-img');

});

// Check binding
document.getElementById('check-btn').addEventListener('click',()=>{
  if(!isAntibodyComplete()){
    resultDisp.textContent='❌ Select all chains first.';
    return;
  }
  if(isMatch()){
    resultDisp.textContent='✅ Perfect Fit!';
    [lightSlotEl,...Object.values(heavySlotsEls),antigenSlot].forEach(flash);
  } else {
    resultDisp.textContent='✘ No Binding. Try another combo.';
  }
});

// Release antibody – generates floating copies
releaseBtn.addEventListener('click', () => {
  if (!isAntibodyComplete()) return;
  const newOnes = generateFloatingAntibodies(
    selectedHeavy, selectedLight, 10, floatingArea, 1
  );
  floatingAntibodies = floatingAntibodies.concat(newOnes);
  if (!animationStarted) {
    animationStarted = true;
    requestAnimationFrame(animate);
  }
});

// Reset
function resetAll(){
  selectedHeavy={V:null,D:null,J:null};
  selectedLight=null;
  heavyIndex=0;
  document.querySelectorAll('.chain-img').forEach(c=>c.classList.remove('selected'));
  Object.values(heavySlotsEls).forEach(s=>{s.innerHTML=s.id.split('-').pop().toUpperCase();});
  lightSlotEl.innerHTML='Light';
  resultDisp.textContent='Awaiting assembly…';
  releaseBtn.disabled=true;
  floatingArea.innerHTML = '';
  floatingAntibodies = [];
}

document.getElementById('reset-btn').addEventListener('click',resetAll);

function nextAntigen () {
  /* 1) 随机决定本轮抗原的片段 --------------------------- */
  antigenLightId  = 'L' + Math.ceil(Math.random()*5);
  antigenHeavyIds = [
    'H' + Math.ceil(Math.random()*5),
    'H' + Math.ceil(Math.random()*5),
    'H' + Math.ceil(Math.random()*5)
  ];

  /* 2) 在槽里画出骨架 ----------------------------------- */
  const slot = document.getElementById('antigen-slot');
  slot.innerHTML = createAntigenSvg();
  const svg = slot.querySelector('svg');
  svg.style.transformOrigin = 'center center';
  svg.style.transform       = 'scale(1.5)';

  /* 3) 贴片段 ------------------------------------------- */
  decorateAntigenSvg(svg, antigenLightId);

  /* 4) 更新提示文本 ------------------------------------- */
  document.getElementById('result-display').textContent = 'Awaiting assembly…';
}

nextAntigen()

document.getElementById('next-antigen-btn')
        .addEventListener('click', nextAntigen);
